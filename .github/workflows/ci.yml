name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: make
      - run: make test
      - run: make test-integration
      # The golden corpus is generated from the spec-authored cases:
      # regenerating must be a clean diff, so a case edit and its
      # fixtures arrive together.
      - run: python3 tools/interop_corpus.py --check
      # The consumer contract: mizu.c + mizu.h + mizu_ext.h alone, no
      # defines — the public-only program and the ext-surface proof must
      # link and run, not just compile. The stamp check guards the
      # bare-file skew case (all three files must carry the identical
      # Version line).
      - name: amalgamation
        run: |
          tools/amalgamate.sh
          for t in tests/unit/*.c; do
            cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
              -I. -Isrc "$t" mizu.c -o test_amalg
            ./test_amalg
          done
          printf '#include "mizu.h"\nint main(void){return mizu_version()==0;}\n' \
            > public_only.c
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -I. \
            public_only.c mizu.c -o public_only
          ./public_only
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/ext_surface.c mizu.c -o ext_surface_amalg
          ./ext_surface_amalg
          cmp <(grep -m1 'Version:' mizu.c) <(grep -m1 'Version:' mizu.h)
          cmp <(grep -m1 'Version:' mizu.c) <(grep -m1 'Version:' mizu_ext.h)
          cmp <(grep -m1 'Version:' mizu.c) <(grep -m1 'Version:' mizu_ext.c)
          # The FFI form: mizu.c + mizu_ext.c as one shared library must
          # export exactly the surface the Makefile's build does (the
          # link and the symbol listing are per platform, as in
          # tools/check-exports.sh).
          case "$(uname -s)" in
            Linux)
              cc -std=c11 -Wall -Wextra -Wpedantic -Werror -I. -shared -fPIC \
                -fvisibility=hidden -DMIZU_SHARED mizu.c mizu_ext.c \
                -o libmizu_amalg.so -pthread -lrt
              nm -D --defined-only libmizu_amalg.so | awk '{print $NF}' | \
                grep '^mizu_' | sort -u > amalg_exports.txt ;;
            Darwin)
              cc -std=c11 -Wall -Wextra -Wpedantic -Werror -I. -dynamiclib \
                -fPIC -fvisibility=hidden -DMIZU_SHARED mizu.c mizu_ext.c \
                -o libmizu_amalg.dylib
              nm -gU libmizu_amalg.dylib | awk '{print $NF}' | \
                sed -n 's/^_\(mizu_.*\)/\1/p' | sort -u > amalg_exports.txt ;;
          esac
          diff -u tools/exports.txt amalg_exports.txt

  # The shared library must export exactly the mizu.h + mizu_ext.h
  # surface: a missing symbol is an ABI break, an extra one is a leak
  # past MIZU_API.
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make
      - run: tools/check-exports.sh

  # The Codecov upload: the unit tier's instrumented run as an lcov
  # export (make coverage-export). The llvm-cov/llvm-profdata version
  # must match the clang that produced the profraw.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          v=$(clang --version | sed -n 's/.*version \([0-9][0-9]*\)\..*/\1/p' | head -1)
          if ! command -v llvm-cov-"$v" >/dev/null; then
            sudo apt-get update && sudo apt-get install -y llvm-"$v"
          fi
          make coverage-export LLVM_COV=llvm-cov-"$v" LLVM_PROFDATA=llvm-profdata-"$v"
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.lcov
          fail_ci_if_error: false

  # libFuzzer bursts: fixed seed + fixed run count, so deterministic.
  # ASan+UBSan catch what the torn-byte parsers would otherwise hide.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-fuzz

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [address, undefined, thread]
    steps:
      - uses: actions/checkout@v7
      - name: test (${{ matrix.san }})
        run: |
          make clean
          # The integration tier forks peers from a process whose death
          # listener thread is already running, and the peer starts its
          # own: TSan on Linux refuses to start threads after a
          # multi-threaded fork and kills the child, so that tier runs
          # under ASan and UBSan only (the unit tier covers TSan).
          tiers="test test-integration"
          if [ "${{ matrix.san }}" = thread ]; then tiers=test; fi
          make CFLAGS="-O1 -g -fsanitize=${{ matrix.san }} -fno-omit-frame-pointer" \
               LDFLAGS="-fsanitize=${{ matrix.san }}" $tiers

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools\build-win.bat test

  # The R package builds the vendored core with Rtools (MinGW-w64 gcc,
  # UCRT) — this leg guards that toolchain. `make test` links only the
  # static lib, so no Makefile MINGW case is needed.
  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - run: make test
